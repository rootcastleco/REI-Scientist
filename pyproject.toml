[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rei-scientist"
version = "0.1.0"
description = "Bounded, reproducible, evidence-first autonomous experiment orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Rootcastle Engineering & Innovation"}]
license = {text = "MIT"}
keywords = ["scientific-discovery", "reproducibility", "optimization", "agentic-research"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[project.scripts]
rei-scientist = "rei_scientist.cli:main"
rei-scientist-workspace = "rei_scientist.workspace_app:main"
rei-scientist-figure = "rei_scientist.workspace_figure:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rei_scientist = ["workspace.html", "workspace.css", "workspace.js"]
